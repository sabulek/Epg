name: Aktualizace EPG

on:
  schedule:
    - cron: '17 2,14 * * *'   # 2x denně (cca 3:17 a 15:17 našeho času)
  workflow_dispatch:          # ruční spuštění tlačítkem "Run workflow"

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stažení nástroje iptv-org/epg
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git grabber
          cd grabber && npm ci --no-audit --no-fund

      - name: Stažení programu
        env:
          NODE_OPTIONS: --tls-cipher-list=DEFAULT@SECLEVEL=0
        run: |
          cd grabber
          npm run grab --- \
            --channels=../channels.xml \
            --output=../out/guide.xml \
            --days=3 \
            --maxConnections=5 \
            --timeout=30000 \
            --gzip

      - name: Kontrola výsledku
        run: |
          ls -la out
          echo "Počet pořadů: $(grep -c '<programme' out/guide.xml)"
          test "$(grep -c '<programme' out/guide.xml)" -gt 100

      - name: Zveřejnění do větve "epg"
        run: |
          cd out
          git init -q -b epg
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml guide.xml.gz
          git commit -qm "EPG $(date -u +%F_%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" epg
